# Documentation: https://gohugo.io/getting-started/configuration
# Don't remove _merge, which imports default config
theme: hugo-theme-yue
baseURL: https://pdddd.one/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false # Single language, so no /en/ prefix in URLs
enableGitInfo: false # Set lastmod from git history, this may increase build time
enableEmoji: true # Emoji list: https://gohugo.io/quick-reference/emojis/
enableRobotsTXT: true

# How to run this site is in the Makefile: `make serve` for local editing,
# `make build` for the files that go online. Keep them apart – see the comment
# there for why a plain `hugo` build over a running `hugo server` makes pages
# lose their styling.

# Hugo adds an RSS feed to every list by default. All of them are turned off
# here and only the blog opts back in, in its own front matter
# (/content/en/blog/_index.md).
outputs:
  home: [html]
  page: [html]
  section: [html]
  taxonomy: [html] # /tags/ and /categories/
  term: [html] # /tags/finland/ and the like

params:
  _merge: deep # Import default config
  rssFullContent: true
  homePagerSize: 5
  sectionPagerSize: 10000 # Default: 10, set this to a large number to remove pagination
  description: >- # Used by the meta description tag and Open Graph
    Patrik Drbal – graduate computer science student and teaching assistant at the
    Department of Theoretical Computer Science, FIT CTU in Prague.
    Software developer and analyst at Target Technologie.
  images:
    # Default image used in Open Graph, see https://gohugo.io/templates/embedded/#configure-open-graph
    - favicon.png # /static/favicon.png
  # Shown as icons in the footer, in this order. icon is /assets/icons/social/<icon>.svg,
  # the Font Awesome set carried over from the previous site (see its LICENSE there).
  socials:
    - name: GitHub
      url: https://github.com/whaypr
      icon: github
    - name: LinkedIn
      url: https://www.linkedin.com/in/patrik-drbal
      icon: linkedin
    - name: Instagram
      url: https://www.instagram.com/drbalpat
      icon: instagram
    - name: Facebook
      url: https://www.facebook.com/patrik-drbal
      icon: facebook

frontmatter:
  lastmod: ['lastmod', ':default'] # lastmod in front matter has highest precedence

markup:
  _merge: deep # Import default config
  goldmark:
    renderer:
      unsafe: true # Allow HTML code in Markdown, see https://gohugo.io/getting-started/configuration-markup/#rendererunsafe

# Any key not defined under a languages will fall back to the global value in the root of configuration
languages:
  en:
    contentDir: content/en
    locale: en-US
    direction: ltr
    label: English
    title: Patrik Drbal # Site name, shown in the header, browser tabs and feeds
    weight: 10
    menus:
      main:
        - name: Academia
          pageRef: /academia
          weight: 20
        # Tags and categories are reachable from the posts themselves, see
        # /content/en/tags/ and /content/en/categories/
    params:
      dateFormat: Jan 02, 2006 # See https://gohugo.io/functions/time/format/
      author: Patrik Drbal # Used by the RSS feed

caches:
  images:
    dir: :cacheDir/images
